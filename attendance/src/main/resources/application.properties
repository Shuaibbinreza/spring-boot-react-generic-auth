spring.application.name=attendance

# Server Configuration
server.port=8080

# Oracle Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521:orcl/GEN_AUTH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cmdt_event}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:event123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate Configuration for Oracle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# H2 Console (Disabled for Oracle environment)
spring.h2.console.enabled=false

# JWT Security Configuration Properties (Portable & Configurable)
app.jwt.secret=9a2f8c7e6d5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 hours
app.jwt.refresh-expiration-ms=604800000
# 604800000 ms = 7 days
app.jwt.header-name=Authorization
app.jwt.token-prefix=Bearer 
