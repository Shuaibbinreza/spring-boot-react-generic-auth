spring.application.name=attendance

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:attendancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration Properties (Portable & Configurable)
app.jwt.secret=9a2f8c7e6d5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 hours
app.jwt.refresh-expiration-ms=604800000
# 604800000 ms = 7 days
app.jwt.header-name=Authorization
app.jwt.token-prefix=Bearer 
